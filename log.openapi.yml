components:
  securitySchemes:
    Ceten:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BDE:
      type: http
      scheme: bearer
      bearerFormat: JWT
    Admin:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # base types
    Health:
      type: object
      required:
        - status
        - nb
      properties:
        status:
          type: string
          example: "ok"
        nb:
          type: integer
          example: 1
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: "jean.michel@telecomnancy.net"
        password:
          type: string
          example: "password"
    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - group
        - clubId
        - email
        - password
      properties:
        firstName:
          type: string
          example: jean
        lastName:
          type: string
          example: michel
        group:
          type: string
          example: ISS
        clubId:
          type: integer
          format: uint
          example: 1
        email:
          type: string
          example: "jean.michel2@telecomnancy.net"
        password:
          type: string
          example: "password"
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Error message"
    Account:
      type: object
      required:
        - userId
        - FirstName
        - LastName
      properties:
        userId:
          type: integer
          format: uint
          example: 1
        FirstName:
          type: string
          example: Baptiste
        LastName:
          type: string
          example: J
        Group:
          type: string
          example: ISS
    Permanence:
      type: object
      required:
        - date
        - status
      properties:
        date:
          type: string
          format: date
          example: "2025-02-17"
        status:
          type: string
          enum: ["available", "unavailable", "selected"]
    Autofill:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
          format: date
          example: "2025-02-17"
        endDate:
          type: string
          format: date
          example: "2025-02-17"
    NoteDeFrais:
      type: object
      properties:
        userId:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2025-02-17"
        amount:
          type: number
          example: 12.34
        description:
          type: string
          example: "Description"
    LocationPerso:
      type: object
      properties:
        id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2025-02-17"
        description:
          type: string
          example: "Location description"
    LocationAsso:
      type: object
      properties:
        id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2025-02-17"
        description:
          type: string
          example: "Location description"
    Materiel:
      type: object
      properties:
        id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2025-02-17"
        description:
          type: string
          example: "Materiel description"
