          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      security: []
      responses:
        "200":
          description: "Register"
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: "Account created"
        "400":
          description: "Invalid input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: "Email already used"
